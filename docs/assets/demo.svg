<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" role="img" aria-label="ycli terminal demo">
  <title>ycli — Yandex 360 CLI demo</title>

  <!-- Window chrome -->
  <rect width="780" height="540" rx="8" fill="#1e1e2e"/>

  <!-- Title bar -->
  <rect width="780" height="38" rx="8" fill="#313244"/>
  <rect y="30" width="780" height="8" fill="#313244"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="7" fill="#f38ba8"/>
  <circle cx="44" cy="19" r="7" fill="#a6e3a1"/>
  <circle cx="66" cy="19" r="7" fill="#f9e2af"/>

  <!-- Title bar text -->
  <text x="390" y="24" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#cdd6f4" text-anchor="middle" dominant-baseline="middle">ycli — Yandex 360 toolkit</text>

  <!-- Terminal content area -->
  <g font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="13" fill="#cdd6f4">

    <!-- Block 1: ycli help command -->
    <!-- Prompt -->
    <text x="20" y="70"><tspan fill="#f38ba8" font-weight="bold">❯</tspan><tspan fill="#89dceb"> ycli --help</tspan></text>

    <!-- Help output: usage line -->
    <text x="20" y="92" fill="#6c7086"> Usage: </text>
    <text x="75" y="92" fill="#cdd6f4">ycli</text>
    <text x="109" y="92" fill="#6c7086">[OPTIONS] COMMAND [ARGS]...</text>

    <!-- Blank line -->
    <text x="20" y="109" fill="#45475a"> ycli — Yandex 360 API SDK CLI.</text>

    <!-- Options box -->
    <text x="20" y="131" fill="#45475a">╭─ </text>
    <text x="44" y="131" fill="#f9e2af">Options</text>
    <text x="103" y="131" fill="#45475a"> ───────────────────────────────────────────────╮</text>
    <text x="20" y="148" fill="#45475a">│ </text>
    <text x="32" y="148" fill="#89b4fa">--help</text>
    <text x="80" y="148" fill="#6c7086">         Show this message and exit.</text>
    <text x="714" y="148" fill="#45475a"> │</text>
    <text x="20" y="165" fill="#45475a">╰──────────────────────────────────────────────────────╯</text>

    <!-- Commands box -->
    <text x="20" y="182" fill="#45475a">╭─ </text>
    <text x="44" y="182" fill="#f9e2af">Commands</text>
    <text x="110" y="182" fill="#45475a"> ──────────────────────────────────────────────╮</text>
    <text x="20" y="199" fill="#45475a">│ </text>
    <text x="32" y="199" fill="#89b4fa">wiki    </text>
    <text x="97" y="199" fill="#6c7086">  Yandex Wiki API.</text>
    <text x="714" y="199" fill="#45475a"> │</text>
    <text x="20" y="216" fill="#45475a">│ </text>
    <text x="32" y="216" fill="#89b4fa">tracker </text>
    <text x="97" y="216" fill="#6c7086">  Yandex Tracker read/write.</text>
    <text x="714" y="216" fill="#45475a"> │</text>
    <text x="20" y="233" fill="#45475a">│ </text>
    <text x="32" y="233" fill="#89b4fa">forms   </text>
    <text x="97" y="233" fill="#6c7086">  Yandex Forms read.</text>
    <text x="714" y="233" fill="#45475a"> │</text>
    <text x="20" y="250" fill="#45475a">╰──────────────────────────────────────────────────────╯</text>

    <!-- Block 2: tracker issue -->
    <text x="20" y="278"><tspan fill="#f38ba8" font-weight="bold">❯</tspan><tspan fill="#89dceb"> ycli tracker issues get TRACKER-1</tspan></text>

    <text x="20" y="300"><tspan fill="#cba6f7" font-weight="bold">TRACKER-1</tspan><tspan fill="#6c7086">  ·  </tspan><tspan fill="#cdd6f4">Set up project scaffolding</tspan></text>
    <text x="20" y="317" fill="#6c7086">status:   </text>
    <text x="98" y="317" fill="#a6e3a1">In Progress</text>
    <text x="196" y="317" fill="#6c7086">     assignee: </text>
    <text x="289" y="317" fill="#cdd6f4">alice</text>
    <text x="20" y="334" fill="#6c7086">priority: </text>
    <text x="98" y="334" fill="#f9e2af">Normal</text>
    <text x="196" y="334" fill="#6c7086">           updated:  </text>
    <text x="313" y="334" fill="#cdd6f4">2026-06-20</text>

    <!-- Block 3: wiki page -->
    <text x="20" y="362"><tspan fill="#f38ba8" font-weight="bold">❯</tspan><tspan fill="#89dceb"> ycli wiki pages get onboarding</tspan></text>

    <text x="20" y="384"><tspan fill="#cba6f7" font-weight="bold">onboarding</tspan><tspan fill="#6c7086">  ·  </tspan><tspan fill="#cdd6f4">Team Onboarding Guide</tspan></text>
    <text x="20" y="401" fill="#6c7086">author: </text>
    <text x="80" y="401" fill="#cdd6f4">bob</text>
    <text x="115" y="401" fill="#6c7086">   revision: </text>
    <text x="200" y="401" fill="#cdd6f4">7</text>
    <text x="215" y="401" fill="#6c7086">   children: </text>
    <text x="300" y="401" fill="#cdd6f4">4</text>

    <!-- Block 4: MCP server -->
    <text x="20" y="429"><tspan fill="#f38ba8" font-weight="bold">❯</tspan><tspan fill="#89dceb"> ycli-mcp</tspan><tspan fill="#6c7086">   # read-only MCP server</tspan></text>

    <text x="20" y="451" fill="#6c7086">Starting MCP server on stdio …</text>
    <text x="20" y="468" fill="#6c7086">Tools: </text>
    <text x="68" y="468" fill="#89b4fa">wiki_pages_get</text>
    <text x="190" y="468" fill="#6c7086">, </text>
    <text x="203" y="468" fill="#89b4fa">wiki_pages_descendants</text>
    <text x="394" y="468" fill="#6c7086">,</text>
    <text x="68" y="485" fill="#89b4fa">tracker_issues_get</text>
    <text x="225" y="485" fill="#6c7086">, </text>
    <text x="238" y="485" fill="#89b4fa">tracker_issues_list</text>
    <text x="403" y="485" fill="#6c7086">, </text>
    <text x="416" y="485" fill="#89b4fa">tracker_issues_search</text>
    <text x="599" y="485" fill="#6c7086">,</text>
    <text x="68" y="502" fill="#89b4fa">forms_surveys_list</text>
    <text x="225" y="502" fill="#6c7086">, </text>
    <text x="238" y="502" fill="#89b4fa">forms_answers_list</text>

    <!-- Cursor -->
    <rect x="20" y="521" width="8" height="16" fill="#f38ba8" opacity="0.8"/>

  </g>
</svg>
