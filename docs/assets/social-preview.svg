<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ycli social preview">
  <title>ycli — one Yandex toolkit, four ways to use it</title>

  <!-- Fonts are pinned explicitly: on the author's machine `monospace`/`SF Mono` both
       resolve to Noto Sans Mono, so we name it directly for a deterministic render.
       Regenerate the PNG with scripts/gen_social_preview.sh — never hand-edit the PNG. -->

  <!-- Background -->
  <rect width="1280" height="640" fill="#1e1e2e"/>

  <!-- Top accent bar -->
  <rect width="1280" height="4" fill="#cba6f7"/>

  <!-- Sparse dot texture (symmetric about x=640) -->
  <g fill="#313244" opacity="0.55">
    <circle cx="100" cy="44" r="2"/><circle cx="220" cy="44" r="2"/><circle cx="340" cy="44" r="2"/><circle cx="460" cy="44" r="2"/><circle cx="580" cy="44" r="2"/><circle cx="700" cy="44" r="2"/><circle cx="820" cy="44" r="2"/><circle cx="940" cy="44" r="2"/><circle cx="1060" cy="44" r="2"/><circle cx="1180" cy="44" r="2"/>
    <circle cx="100" cy="596" r="2"/><circle cx="220" cy="596" r="2"/><circle cx="340" cy="596" r="2"/><circle cx="460" cy="596" r="2"/><circle cx="580" cy="596" r="2"/><circle cx="700" cy="596" r="2"/><circle cx="820" cy="596" r="2"/><circle cx="940" cy="596" r="2"/><circle cx="1060" cy="596" r="2"/><circle cx="1180" cy="596" r="2"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="168"
    font-family="'Noto Sans Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'DejaVu Sans Mono', monospace"
    font-size="88" font-weight="bold" fill="#cdd6f4"
    text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">ycli</text>

  <!-- Tagline -->
  <text x="640" y="240"
    font-family="'Noto Sans', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="23" fill="#a6adc8"
    text-anchor="middle" dominant-baseline="middle">One Yandex toolkit — four ways to use it</text>

  <!-- Four surface pills (block centered on x=640: x 352..928) -->
  <g font-family="'Noto Sans Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'DejaVu Sans Mono', monospace"
     font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    <rect x="352" y="280" width="132" height="46" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/><text x="418" y="304" fill="#89b4fa">CLI</text>
    <rect x="500" y="280" width="132" height="46" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/><text x="566" y="304" fill="#cba6f7">MCP</text>
    <rect x="648" y="280" width="132" height="46" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/><text x="714" y="304" fill="#a6e3a1">SDK</text>
    <rect x="796" y="280" width="132" height="46" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/><text x="862" y="304" fill="#f9e2af">Plugin</text>
  </g>

  <!-- Covered services — bright and prominent -->
  <text x="640" y="388"
    font-family="'Noto Sans Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'DejaVu Sans Mono', monospace"
    font-size="27" font-weight="bold" fill="#cdd6f4"
    text-anchor="middle" dominant-baseline="middle">Tracker · Wiki · Forms</text>

  <!-- Roadmap label -->
  <text x="640" y="432"
    font-family="'Noto Sans Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'DejaVu Sans Mono', monospace"
    font-size="13" fill="#7f849c"
    text-anchor="middle" dominant-baseline="middle" letter-spacing="4">Building…</text>

  <!-- Planned services — quiet -->
  <g font-family="'Noto Sans Mono', 'JetBrainsMono Nerd Font', ui-monospace, 'DejaVu Sans Mono', monospace"
     font-size="16" fill="#6c7086" text-anchor="middle" dominant-baseline="middle">
    <text x="640" y="466">Admin · Disk · Telemost · ID · Metrika · DataLens · Market · Direct · Audience · Webmaster</text>
    <text x="640" y="496">Weather · Speller · Tanker · Schedules · SafeBrowsing · Dialogs · Games · Travel · Video · AdMetrica · RTB</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="636" width="1280" height="4" fill="#313244"/>
</svg>
