[project]
name = "yandex-cli"
version = "0.23.1"
description = "Interact with Yandex 360 services (Wiki, Tracker, Forms, …) from a CLI, an MCP server, or a Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sava Znatnov", email = "careless.sava@gmail.com" }]
keywords = ["yandex", "yandex-360", "tracker", "wiki", "forms", "cli", "mcp", "sdk", "fastmcp", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.13.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "typer>=0.26.8",
    "uplink>=0.10.0",
]

# The MCP server (`ycli mcp`) is optional — install with `yandex-cli[mcp]`.
[project.optional-dependencies]
mcp = ["fastmcp>=3.4.2"]
service-account = [
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
yandex-cli = "ycli.cli.app:main"
ycli = "ycli.cli.app:main"

[project.urls]
Homepage = "https://github.com/bim-ba/ycli"
Repository = "https://github.com/bim-ba/ycli"
Documentation = "https://github.com/bim-ba/ycli/tree/main/docs"
Issues = "https://github.com/bim-ba/ycli/issues"
Changelog = "https://github.com/bim-ba/ycli/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycli"]

# Keep the sdist lean: ship only the package + changelog (pyproject, README, and
# LICENSE are always included from metadata) — not the repo's docs, tests, Claude
# plugin, agent config, or vendored API references.
[tool.hatch.build.targets.sdist]
only-include = ["src/ycli", "CHANGELOG.md"]

# TestPyPI as an explicit publish target (used by `uv publish --index testpypi`).
# `explicit = true` keeps it out of normal dependency resolution.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=ycli --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: tests that exercise CLI/MCP wiring end-to-end (no live network)",
]

[tool.coverage.run]
source = ["ycli"]
# Lines and branches: a guard with an untested side counts as missing coverage.
branch = true
# tests/test_new_endpoint.py imports a throwaway scaffold from tmp_path into the ycli namespace
omit = ["*/scaffold_probe/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "import-linter>=2.12",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

# Automated versioning from Conventional Commits. CI runs `semantic-release version`
# on push to main; a separate job publishes the tagged build to PyPI.
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
# The Claude Code plugin is released together with the package, so it carries the same version.
version_variables = ["plugins/yandex-360/.claude-plugin/plugin.json:version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
build_command = ""   # skip PSR's build; the release workflow builds with `uv build`

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "ANN", "TC"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["ycli"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "ANN"]
"scripts/**/*.py" = ["ANN"]
"src/ycli/yandex/**/client.py" = ["ANN"]
# Typer reads command annotations at runtime (inspect.signature(eval_str=True)), so their
# imports must stay real imports, never `if TYPE_CHECKING:` ones.
"src/ycli/**/cli.py" = ["TC001", "TC002", "TC003"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.importlinter]
root_package = "ycli"
include_external_packages = true
# Imports under `if TYPE_CHECKING:` never execute, so they cannot break a layer at runtime.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "ARCH-2: cli/mcp/models never import HTTP libraries directly"
type = "forbidden"
source_modules = [
    "ycli.yandex.**.cli",
    "ycli.yandex.**.mcp",
    "ycli.yandex.**.models",
]
forbidden_modules = ["requests", "uplink", "httpx2"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ARCH-2: fastmcp is imported only in mcp modules"
type = "forbidden"
source_modules = [
    "ycli.mcp",
    "ycli.cli",
    "ycli.cli.**",
    "ycli.yandex.**.cli",
    "ycli.yandex.**.client",
    "ycli.yandex.**.models",
]
forbidden_modules = ["fastmcp"]
allow_indirect_imports = true
# The server, and `ycli mcp methods` (behind a guard). The package __init__ must stay free of
# fastmcp: the base install loads `ycli mcp` without the extra.
ignore_imports = ["ycli.mcp.server -> fastmcp", "ycli.mcp.cli -> fastmcp"]

[[tool.importlinter.contracts]]
name = "ARCH-2: MCP never imports the CLI layer (ycli.cli, typer), even through a helper"
type = "forbidden"
source_modules = [
    "ycli.mcp.server",
    "ycli.yandex.mcp",
    "ycli.yandex.**.mcp",
    "ycli.yandex.**.dependencies",
]
forbidden_modules = ["ycli.cli", "typer"]

[[tool.importlinter.contracts]]
name = "ARCH-2: the httpx2 core knows no service and no surface"
type = "forbidden"
source_modules = ["ycli.yandex.core"]
forbidden_modules = [
    "ycli.yandex.tracker",
    "ycli.yandex.wiki",
    "ycli.yandex.forms",
    "ycli.yandex.status",
    "ycli.cli",
    "ycli.mcp",
    "typer",
    "fastmcp",
    "requests",
    "uplink",
]
