[project]
name = "yandex-cli"
version = "0.8.0"
description = "Interact with Yandex 360 services (Wiki, Tracker, Forms, …) from a CLI, an MCP server, or a Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sava Znatnov", email = "careless.sava@gmail.com" }]
keywords = ["yandex", "yandex-360", "tracker", "wiki", "forms", "cli", "mcp", "sdk", "fastmcp", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "uplink>=0.10.0",
]

# The MCP server (`ycli mcp`) is optional — install with `yandex-cli[mcp]`.
[project.optional-dependencies]
mcp = ["fastmcp>=3.4.2"]

[project.scripts]
yandex-cli = "ycli.cli:main"
ycli = "ycli.cli:main"

[project.urls]
Homepage = "https://github.com/bim-ba/ycli"
Repository = "https://github.com/bim-ba/ycli"
Documentation = "https://github.com/bim-ba/ycli/tree/main/docs"
Issues = "https://github.com/bim-ba/ycli/issues"
Changelog = "https://github.com/bim-ba/ycli/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycli"]

# Keep the sdist lean: ship only the package + changelog (pyproject, README, and
# LICENSE are always included from metadata) — not the repo's docs, tests, Claude
# plugin, agent config, or vendored API references.
[tool.hatch.build.targets.sdist]
only-include = ["src/ycli", "CHANGELOG.md"]

# TestPyPI as an explicit publish target (used by `uv publish --index testpypi`).
# `explicit = true` keeps it out of normal dependency resolution.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=ycli --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: tests that exercise CLI/MCP wiring end-to-end (no live network)",
]

[tool.coverage.run]
source = ["ycli"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "import-linter>=2.12",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

# Automated versioning from Conventional Commits. CI runs `semantic-release version`
# on push to main; a separate job publishes the tagged build to PyPI.
[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
build_command = ""   # skip PSR's build; the release workflow builds with `uv build`

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "ANN", "TC"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["ycli"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "ANN"]
"scripts/**/*.py" = ["T201", "ANN"]
"src/ycli/yandex/**/client.py" = ["ANN"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.importlinter]
root_package = "ycli"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ARCH-2: cli/mcp/models never import HTTP libraries directly"
type = "forbidden"
source_modules = [
    "ycli.yandex.**.cli",
    "ycli.yandex.**.mcp",
    "ycli.yandex.**.models",
]
forbidden_modules = ["requests", "uplink"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ARCH-3: fastmcp is imported only in mcp modules"
type = "forbidden"
source_modules = [
    "ycli.cli",
    "ycli.output",
    "ycli.yandex.**.cli",
    "ycli.yandex.**.client",
    "ycli.yandex.**.models",
]
forbidden_modules = ["fastmcp"]
allow_indirect_imports = true
