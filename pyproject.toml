[project]
name = "ycli"
version = "0.1.0"
description = "Interact with Yandex 360 services (Wiki, Tracker, Forms, …) from a CLI, an MCP server, or a Python SDK."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "typer>=0.26.8",
    "uplink>=0.10.0",
]

[project.scripts]
ycli = "ycli.cli:main"
ycli-mcp = "ycli.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=ycli --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: tests that exercise CLI/MCP wiring end-to-end (no live network)",
]

[tool.coverage.run]
source = ["ycli"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
]
