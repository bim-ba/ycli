# Public Yandex 360 API-reference deep links for the README Coverage tables.
#
# Consumed by scripts/gen_coverage.py to turn every resource/operation name in the
# generated COVERAGE block into a link to the official docs. This file is the single
# maintained source of those links (the vendored api-ref under references/ is
# git-ignored, so it cannot be read at generation time).
#
# Derivation
# ----------
# Each value is a path RELATIVE TO
#     https://yandex.ru/support/{domain}/en/api-ref/
# with the trailing ".md" dropped. The vendored source for the same page is
#     references/yandex-360/{domain}/ru/api-ref/{path}.md
# whose front-matter `alternate:` lists the canonical en/ru URLs. The English
# (`/en/`) pages were spot-checked to return 200 for all three domains (2026-07-13).
#
# Keys
# ----
# Tables:      [<domain>.<resource>]  where <domain> is tracker|wiki|forms and
#              <resource> is the DISPLAY name (e.g. `import`, not `import_`).
# `resource`:  links the resource name to its api-ref landing page.
# `operations.<op>`: links that operation, where <op> is the SDK operation name
#              exactly as introspected by gen_coverage (`_sdk_operations`).
#
# Rendering rules (enforced by gen_coverage.py)
# ---------------------------------------------
# * an operation with its own `operations.<op>` entry links to that endpoint page;
# * an operation with no entry falls back to the resource's `resource` link;
# * a resource with no `resource` value (and its ops) render as plain text — never a
#   guessed/broken link. gen_coverage `--check` prints the plain-text gaps and
#   tests/test_coverage_links.py pins them so a new gap is surfaced, not silent.
#
# /new-endpoint authors: add the new resource's `resource` + `operations.*` paths
# here so its README row deep-links like the rest.

