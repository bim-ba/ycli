# Fast local guardrails — run: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (ARCH-2 layers)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/ycli/.*\.py$
      - id: architecture-tests
        name: architecture invariants (ARCH-1..8)
        entry: uv run pytest tests/test_architecture.py tests/test_snapshots.py tests/test_docs.py -q --no-cov
        language: system
        pass_filenames: false
        # The Python surface, plus the live docs tests/test_docs.py scans (keep in sync with
        # its _LIVE_DOC_GLOBS) and ARCHITECTURE.md, which defines the invariants.
        files: '^(src/ycli/|tests/).*\.py$|^(README|CLAUDE|AGENTS|CONTRIBUTING|SECURITY|ARCHITECTURE)\.md$|^(docs/conventions|docs/en|plugins)/.*\.md$'
      - id: no-skip-ci
        name: block skip-ci tokens in tracked files
        # Match the full token set GitHub honors (see CLAUDE.md "Never write a skip-ci token").
        entry: bash -c '! git diff --cached -U0 | grep -niE "\[(skip ci|ci skip|no ci|skip actions|actions skip)\]|skip-checks:[[:space:]]*true"'
        language: system
        pass_filenames: false
  # Its own environment: pydoclint needs docstring-parser-fork, which installs the same
  # `docstring_parser` module as fastmcp's docstring-parser, so one venv cannot hold both.
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.11.0
    hooks:
      - id: pydoclint
        files: ^src/ycli/.*\.py$
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.55  # tags are v-prefixed; a bare `0.0.55` can't be checked out and breaks every hook run
    hooks:
      - id: ty
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
