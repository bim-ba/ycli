# Russian site, built after zensical.toml into site/ru/; the generated reference stays English.

[project]
site_name = "ycli"
site_description = "Яндекс 360 (Трекер, Вики, Формы) из CLI, MCP-сервера и Python SDK."
site_url = "https://bim-ba.github.io/ycli/ru/"
repo_url = "https://github.com/bim-ba/ycli"
repo_name = "bim-ba/ycli"
edit_uri = "edit/main/docs/ru/"
docs_dir = "docs/ru"
site_dir = "site/ru"
strict = true
nav = [
  { "Главная" = "index.md" },
  { "Обучение" = [
    "tutorials/first-steps.md",
  ] },
  { "Руководства" = [
    "how-to/authenticate.md",
    "how-to/install-in-your-harness.md",
    "how-to/serve-the-mcp-server.md",
    "how-to/self-host-over-http.md",
    "how-to/script-the-cli.md",
    "how-to/call-an-unwrapped-endpoint.md",
  ] },
  { "Справочник" = [
    "reference/configuration.md",
    { "CLI (англ.)" = "https://bim-ba.github.io/ycli/reference/cli/" },
    { "MCP-инструменты (англ.)" = "https://bim-ba.github.io/ycli/reference/mcp/tracker/" },
    { "Python SDK (англ.)" = "https://bim-ba.github.io/ycli/reference/sdk/tracker/" },
  ] },
  { "Объяснения" = [
    "explanation/design.md",
  ] },
]

[project.theme]
language = "ru"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Тёмная тема" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Светлая тема" }

[project.extra]
alternate = [
  { name = "English", link = "/ycli/", lang = "en" },
  { name = "Русский", link = "/ycli/ru/", lang = "ru" },
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
# The default slug drops non-ASCII, which would leave every Cyrillic heading an empty anchor.
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
