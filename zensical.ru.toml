# Russian site, built after zensical.toml into site/ru/; the generated reference stays English.

[project]
site_name = "ycli"
site_description = "Бизнес-сервисы Яндекса (Трекер, Вики, Формы, DataLens) из CLI, MCP-сервера и Python SDK."
site_url = "https://ycli.savaznatnov.dev/ru/"
repo_url = "https://github.com/bim-ba/ycli"
repo_name = "bim-ba/ycli"
edit_uri = "edit/main/docs/ru/"
docs_dir = "docs/ru"
site_dir = "site/ru"
strict = true
extra_css = ["assets/vendor/termynal/termynal.css"]
extra_javascript = ["assets/vendor/termynal/termynal.js", "assets/javascripts/site.js"]
nav = [
  { "Главная" = "index.md" },
  { "Сервисы" = [
    "services/tracker.md",
    "services/wiki.md",
    "services/forms.md",
    "services/datalens.md",
  ] },
  { "Обучение" = [
    "tutorials/first-steps.md",
  ] },
  { "Руководства" = [
    "how-to/authenticate.md",
    "how-to/install-in-your-harness.md",
    "how-to/common-tasks.md",
    "how-to/serve-the-mcp-server.md",
    "how-to/self-host-over-http.md",
    "how-to/script-the-cli.md",
    "how-to/use-in-ci.md",
    "how-to/keep-content-in-git.md",
    "how-to/call-an-unwrapped-endpoint.md",
    "how-to/call-the-api-asynchronously.md",
  ] },
  { "Справочник" = [
    "reference/configuration.md",
    { "CLI (англ.)" = "https://ycli.savaznatnov.dev/reference/cli/" },
    { "MCP-инструменты (англ.)" = "https://ycli.savaznatnov.dev/reference/mcp/tracker/" },
    { "MCP: prompts и ресурсы (англ.)" = "https://ycli.savaznatnov.dev/reference/mcp/prompts-and-resources/" },
    { "Python SDK (англ.)" = "https://ycli.savaznatnov.dev/reference/sdk/tracker/" },
    { "OpenAPI (англ.)" = "https://ycli.savaznatnov.dev/reference/openapi/" },
  ] },
  { "Объяснения" = [
    "explanation/design.md",
    "explanation/comparison.md",
  ] },
]

[project.theme]
custom_dir = "docs/overrides"
language = "ru"
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
# `primary` is the theme's default colour, spelled out: the social cards fail without it (Zensical 0.0.67).
scheme = "default"
primary = "indigo"
toggle = { icon = "lucide/sun", name = "Тёмная тема" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle = { icon = "lucide/moon", name = "Светлая тема" }

[project.extra]
alternate = [
  { name = "English", link = "/", lang = "en" },
  { name = "Русский", link = "/ru/", lang = "ru" },
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
# The default slug drops non-ASCII, which would leave every Cyrillic heading an empty anchor.
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
# Paths are relative to the repository root; a missing file fails the build.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = "ycli открывает сервисы Яндекса (Трекер, Вики, Формы, DataLens) из командной строки, MCP-сервера для ИИ-агентов и Python SDK. У каждой операции одно имя на всех способах."

[project.plugins.llmstxt.sections]
"Сервисы" = ["services/*.md"]
"Обучение" = ["tutorials/*.md"]
"Руководства" = ["how-to/*.md"]
"Справочник" = ["reference/*.md"]
"Объяснения" = ["explanation/*.md"]

[project.plugins.social]
