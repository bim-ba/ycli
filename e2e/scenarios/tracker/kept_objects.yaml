# Editing what a run must not create, because the API cannot delete it: a local field and a
# trigger kept in the sandbox queue, named by the owner of the organization (LOCAL_FIELD,
# TRIGGER). Each step only rewrites a description or a name. Without the variables every step
# is skipped; the first run with them set is the first run of these steps.
name: tracker/kept-objects
steps:
  - id: local-field
    needs: [LOCAL_FIELD]
    run: tracker localfields update ${QUEUE} ${LOCAL_FIELD} --description "edited by ${RUN}"
    expect:
      description: edited by ${RUN}
  - id: trigger
    needs: [TRIGGER]
    run: tracker triggers get ${QUEUE} ${TRIGGER}
    save:
      version: version
  - id: trigger-rename
    needs: [TRIGGER]
    run: tracker triggers update ${QUEUE} ${TRIGGER} --name "kept for e2e, edited by ${RUN}" --version ${version}
    expect:
      name: kept for e2e, edited by ${RUN}
