# The issue is never deleted (Tracker has no issue delete): it ends closed in the sandbox queue.
name: tracker/issue-lifecycle
smoke: true
steps:
  - id: create
    run: tracker issues create --queue ${QUEUE} --summary "${RUN} lifecycle" --description "created by ${RUN}"
    expect:
      summary: ${RUN} lifecycle
      queue: ${QUEUE}
      status: open
    save:
      key: key
    cleanup: tracker transitions execute ${key} close --field resolution=fixed
  - id: update
    run: tracker issues update ${key} --summary "${RUN} lifecycle edited" --tag e2e
    expect:
      summary: ${RUN} lifecycle edited
      "contains(tags, 'e2e')": true
  - id: comment
    run: tracker comments create ${key} --text "comment from ${RUN}"
    expect:
      text: comment from ${RUN}
    save:
      comment: id
    reads:
      - tracker comments get ${key} ${comment}
      - tracker attachments list ${key}
      - tracker checklists list ${key}
      - tracker links list ${key}
      - tracker links list-filtered ${key}
      - tracker remotelinks list ${key}
      - tracker transitions list ${key}
      - tracker worklog list ${key}
  - id: comment-is-listed
    run: tracker comments list ${key}
    expect:
      "length(@)": 1
      "[0].text": comment from ${RUN}
  - id: start-progress
    run: tracker transitions execute ${key} start_progress
  - id: in-progress
    run: tracker issues get ${key}
    expect:
      status: inProgress
  - id: close
    run: tracker transitions execute ${key} close --field resolution=fixed
    disarms: [create]
  # The resolution is read from the issue itself: a search sees a change a moment later, and a
  # count by it right after the transition answered 0 in a pull request's run.
  - id: closed
    run: tracker issues get ${key}
    expect:
      status: closed
      resolution.key: fixed
      summary: ${RUN} lifecycle edited
  # The count is asked of what a search has had time to learn: the issue by its key.
  - id: counted
    run: 'tracker issues count --query "Key: ${key}"'
    expect:
      "@": 1
