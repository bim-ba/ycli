# The query parameters beyond the body: what a reply carries, who is notified, how a listing
# is filtered and read. The issue ends closed in the sandbox queue; the project is deleted.
name: tracker/issue-options
steps:
  - id: create
    run: tracker issues create --queue ${QUEUE} --summary "${RUN} options" --no-notify
    expect:
      summary: ${RUN} options
    save:
      key: key
    cleanup: tracker transitions execute ${key} close --field resolution=fixed
  - id: get
    run: tracker issues get ${key} --expand transitions --fields summary,status
    expect:
      summary: ${RUN} options
  - id: comment
    run: tracker comments create ${key} --text "comment from ${RUN}"
  - id: comments
    run: tracker comments list ${key} --expand attachments
    expect:
      "length(@)": 1
  - id: changelog
    run: tracker changelog list ${key} --change-type IssueCreated --sort desc
    expect:
      "length(@)": 1
  - id: scroll
    run: 'tracker issues search "Key: ${key}" --scroll-type sorted --per-scroll 1 --scroll-ttl-millis 10000 --expand transitions'
    expect:
      "length(@)": 1
      "[0].key": ${key}
  # A scroll taken in pieces, released by its own token, and gone after that. Measured
  # 2026-10-10: the clear answers 204 and the next page of a released scroll 403, which the
  # CLI tells as a listing that cannot go on (exit 9).
  - id: scroll-in-pieces
    run: 'tracker issues search "Queue: ${QUEUE}" --scroll-type unsorted --per-scroll 1 --limit 1'
    output: listing
    expect:
      "length(items)": 1
      truncated: true
    save:
      scrolled: next
  - id: scroll-clear
    run: tracker issues scroll-clear --next ${scrolled}
  - id: scroll-released
    run: 'tracker issues search "Queue: ${QUEUE}" --next ${scrolled}'
    exits: 9
  - id: suggest
    run: tracker issues suggest "${RUN}" --queue ${QUEUE} --full --fields summary
  - id: priorities
    run: tracker priorities list --no-localized
    expect:
      "length(@) > `0`": true
  - id: queues
    run: tracker queues list --expand team --limit 1
    expect:
      "length(@)": 1
  - id: close
    run: tracker transitions execute ${key} close --field resolution=fixed
    disarms: [create]
  - id: project
    run: tracker entities create project --summary "${RUN} project" --fields summary
    expect:
      "fields.summary": ${RUN} project
    save:
      project: id
    cleanup: tracker entities delete project ${project}
  - id: rename
    run: tracker entities update project ${project} --summary "${RUN} renamed" --fields summary --expand attachments
    expect:
      "fields.summary": ${RUN} renamed
  - id: checklist
    run: tracker entities checklists create project ${project} --text "step one" --fields checklistItems --no-notify --no-notify-author
    expect:
      "length(fields.checklistItems)": 1
    save:
      item: "fields.checklistItems[0].id"
  - id: checklist-deadline
    run: tracker entities checklists items-update project ${project} ${item} --deadline 2027-01-01T00:00:00.000+0000 --deadline-type date --fields checklistItems
    expect:
      "fields.checklistItems[0].deadline.deadlineType": date
  - id: report
    run: 'tracker entities reports-create --summary "${RUN} report" --query "Queue: ${QUEUE}" --type issueFilterExport --field key --field summary'
    expect:
      entityType: report
    save:
      report: id
    cleanup: tracker entities delete report ${report}
  - id: entity-comment
    run: tracker entities comments create project ${project} --text "note ${RUN}" --no-is-add-to-followers --no-notify --expand html
    expect:
      text: note ${RUN}
    save:
      comment: id
    reads:
      - tracker entities get project ${project}
      - tracker entities search project --input-text "${RUN}"
      - tracker entities comments get project ${project} ${comment}
      - tracker entities comments list project ${project}
      - tracker entities attachments list project ${project}
      - tracker entities links list project ${project}
      - tracker entities permissions-get project ${project}
      - tracker entities permissions-get-direct project ${project}
  - id: entity-comment-delete
    run: tracker entities comments delete project ${project} ${comment} --no-notify
  - id: events
    run: tracker entities events-list project ${project} --new-events-on-top --direction forward
    expect:
      "length(@) > `0`": true
  - id: delete-project
    run: tracker entities delete project ${project}
    disarms: [project]
