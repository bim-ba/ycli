# What a queue is set up with: a version, a tag that is removed once no issue carries it, and
# a workflow that is renamed, has one of its actions rewritten and is deleted. The workflow is
# never bound to a queue; the issue ends closed in the sandbox queue.
name: tracker/queue-parts
steps:
  - id: version
    run: tracker queues versions-create --queue ${QUEUE} --name "${RUN} version" --description First --start-date 2027-01-04 --due-date 2027-01-18
    save:
      version: id
    cleanup: tracker queues versions-delete ${version}
  - id: version-rename
    run: tracker queues versions-update ${version} --name "${RUN} version renamed" --description Renamed
    expect:
      name: ${RUN} version renamed
  - id: version-delete
    run: tracker queues versions-delete ${version}
    disarms: [version]
  - id: tagged
    run: tracker issues create --queue ${QUEUE} --summary "${RUN} tagged" --tag ${RUN}-tag
    save:
      key: key
    cleanup: tracker transitions execute ${key} close --field resolution=fixed
  - id: untag
    # A tag can be removed from a queue only when no issue carries it.
    run: >-
      tracker issues update ${key} -F 'tags={"remove": ["${RUN}-tag"]}'
    expect:
      "length(tags)": 0
  - id: tag-delete
    run: tracker queues tags-delete ${QUEUE} ${RUN}-tag
  - id: close
    run: tracker transitions execute ${key} close --field resolution=fixed
    disarms: [tagged]
  - id: workflow
    run: >-
      tracker workflows create --name "${RUN} workflow"
      --initial-action '{"id": "open", "name": {"ru": "Открыть", "en": "Open"}, "target": "open"}'
      --step '{"status": "open", "actions": [{"id": "close", "name": {"ru": "Закрыть", "en": "Close"}, "target": "closed"}]}'
      --step '{"status": "closed", "actions": []}'
    expect:
      "length(steps)": 2
    save:
      workflow: id
      revision: version
    cleanup: tracker workflows delete ${workflow}
  - id: workflow-rename
    run: >-
      tracker workflows update ${workflow} --version ${revision} --name "${RUN} workflow renamed"
      --initial-action '{"id": "open", "name": {"ru": "Открыть", "en": "Open"}, "target": "open"}'
      --step '{"status": "open", "actions": [{"id": "close", "name": {"ru": "Закрыть", "en": "Close"}, "target": "closed"}]}'
      --step '{"status": "closed", "actions": []}'
    expect:
      name: ${RUN} workflow renamed
    save:
      revision: version
  - id: workflow-action
    run: >-
      tracker workflows actions-update ${workflow} open close --version ${revision}
      --action '{"id": "close", "name": {"ru": "Завершить", "en": "Complete"}, "target": "closed"}'
  - id: workflow-delete
    run: tracker workflows delete ${workflow}
    disarms: [workflow]
  # The permissions of the queue, by a call that changes nothing: the account is added to a
  # scope it is in already, and its permissions are read before and after and must be the
  # same. A real grant is not undone by its revoke here: taking a user out of `read` takes it
  # out of `write` too (seen once, 2026-10-06), and the account has rights on this queue.
  - id: permission-subject
    needs: [GRANTEE]
    run: tracker users list
    save:
      subject: "[?passportUid == `${GRANTEE}`] | [0].uid"
  - id: permissions-before
    needs: [GRANTEE]
    # If this fails the sandbox changed: the account is no longer in `write`, and the next
    # step would grant for real. Put it back by hand before running again.
    run: tracker queues user-permissions-get ${QUEUE} ${subject}
    expect:
      "length(permissions.WRITE.users[?id == '${subject}'])": 1
    save:
      before: to_string(permissions)
  - id: permissions-same
    needs: [GRANTEE]
    run: >-
      tracker queues permissions-update ${QUEUE} --write '{"users": {"add": ["${subject}"]}}'
    expect:
      "length(write.users[?id == '${subject}'])": 1
  - id: permissions-after
    needs: [GRANTEE]
    run: tracker queues user-permissions-get ${QUEUE} ${subject}
    expect:
      "to_string(permissions)": ${before}
