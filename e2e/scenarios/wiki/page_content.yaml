# What lives on a page: a grid with its columns, rows and cells, attachments (uploaded at once
# and through an upload session), a comment that is deleted, and the page cloned and moved.
# Everything is made under the page of the run and goes with it.
name: wiki/page-content
steps:
  - id: create
    run: wiki pages create --slug ${RUN} --title "${RUN} page" --content "body ${RUN}" --is-silent
    save:
      id: id
    cleanup: wiki pages delete ${id} --recursive
  - id: grid
    run: wiki grids create --title "${RUN} grid" --page-slug ${RUN}
    expect:
      title: ${RUN} grid
      "length(rows)": 0
    save:
      grid: id
      rev: revision
  - id: columns
    run: >-
      wiki grids columns create ${grid} --revision ${rev} --columns
      '[{"title": "Name", "type": "string", "slug": "name", "required": false},
      {"title": "Stage", "type": "string", "slug": "stage", "required": false}]'
    save:
      rev: revision
  - id: rows
    run: >-
      wiki grids rows create ${grid} --revision ${rev} --rows
      '[{"name": "Launch", "stage": "todo"}, {"name": "Review", "stage": "done"}]'
    expect:
      "length(results)": 2
    save:
      rev: revision
      first: results[0].id
      second: results[1].id
  - id: cell
    run: >-
      wiki grids cells update ${grid} --revision ${rev} --cells
      '[{"row_id": ${first}, "column_slug": "name", "value": "Launch v2"}]'
    expect:
      "length(cells)": 1
    save:
      rev: revision
  - id: row-colour
    run: wiki grids rows update ${grid} ${second} --revision ${rev} --pinned --color orange
  - id: filled
    run: wiki grids get ${grid}
    expect:
      "length(rows)": 2
      "length(structure.columns)": 2
    save:
      rev: revision
  # A name taken by a column gets alternatives; a free one comes back as it is.
  - id: column-suggest-taken
    run: wiki grids columns suggest ${grid} --title Name
    expect:
      slug: name
      occupied: true
      "length(suggest) > `0`": true
  - id: column-suggest-free
    run: wiki grids columns suggest ${grid} --title "Brand new"
    expect:
      slug: brand-new
      occupied: false
  - id: row-move
    run: wiki grids rows move ${grid} --revision ${rev} --row-id ${second} --position 0
    save:
      rev: revision
  - id: column-rename
    run: wiki grids columns update ${grid} stage --revision ${rev} --title "Stage 2"
    expect:
      column.title: Stage 2
    save:
      rev: revision
  - id: column-move
    run: wiki grids columns move ${grid} --revision ${rev} --column-slug stage --position 0
    save:
      rev: revision
  - id: grid-rename
    run: wiki grids update ${grid} --revision ${rev} --title "${RUN} grid renamed"
    save:
      rev: revision
  - id: grid-clone
    run: wiki grids clone ${grid} --target ${RUN}/copy --title "${RUN} copy" --with-data
  - id: row-delete
    run: wiki grids rows delete ${grid} --revision ${rev} --row-id ${first}
    save:
      rev: revision
  - id: column-delete
    run: wiki grids columns delete ${grid} --revision ${rev} --column-slug stage
    save:
      rev: revision
  - id: emptied
    run: wiki grids get ${grid}
    expect:
      "length(rows)": 1
      "length(structure.columns)": 1
  # No --wait: the command prints the id of the operation, which the status read takes.
  - id: grid-clone-async
    run: wiki grids clone ${grid} --target ${RUN}/copy-async --title "${RUN} copy async" --no-wait
    expect:
      operation.type: clone_inline_grid
    save:
      grid_clone_op: operation.id
  - id: upload
    run: wiki attachments upload ${id} ${FILES}/note.txt
    expect:
      "length(@)": 1
    save:
      file: "[0].id"
  - id: uploaded
    run: wiki attachments list ${id} --all
    expect:
      "length(@)": 1
  - id: attachment-get
    run: wiki attachments get ${id} ${file}
    expect:
      "to_string(id) == '${file}'": true
      name: note.txt
      mimetype: text/plain
  - id: attachment-download
    output: text
    run: wiki attachments download ${id} ${file}
    expect:
      "contains(@, 'a note for the live scenarios')": true
  # The address is <page slug>/.files/<file name>, without a leading slash (the download_url
  # of the reply has one and the endpoint refuses it).
  - id: attachment-download-by-url
    output: text
    run: wiki attachments download-by-url ${RUN}/.files/note.txt
    expect:
      "contains(@, 'a note for the live scenarios')": true
  - id: image-upload
    run: wiki attachments upload ${id} ${FILES}/square.png
    expect:
      "[0].mimetype": image/png
    save:
      image: "[0].id"
  # The preview is binary: the bytes go to a file (the null device here), stdout stays empty.
  - id: image-preview
    output: text
    run: wiki attachments previews-download ${id} ${image} --output /dev/null
    expect:
      "length(@)": 0
  - id: image-delete
    run: wiki attachments delete ${id} ${image}
  - id: attachment-delete
    run: wiki attachments delete ${id} ${file}
  - id: session
    run: wiki uploadsessions create --file-name note.txt --file-size 30
    save:
      session: session_id
  - id: session-get
    run: wiki uploadsessions get ${session}
    expect:
      session_id: ${session}
      file_name: note.txt
      file_size: 30
      status: in_progress
      "finished_at == null": true
  - id: session-part
    run: wiki uploadsessions parts-upload ${session} ${FILES}/note.txt --part-number 1
  - id: session-finish
    run: wiki uploadsessions finish ${session}
    expect:
      "finished_at != null": true
  - id: session-finished
    run: wiki uploadsessions get ${session}
    expect:
      status: finished
      "finished_at != null": true
  - id: attach
    run: wiki attachments attach ${id} --session-ids ${session}
    expect:
      "length(@)": 1
  - id: session-to-abort
    run: wiki uploadsessions create --file-name unused.txt --file-size 30
    save:
      unused: session_id
  - id: session-abort
    run: wiki uploadsessions abort ${unused}
  - id: session-left-open
    run: wiki uploadsessions create --file-name unused.txt --file-size 30
  - id: sessions-abort-all
    run: wiki uploadsessions abort-all
  - id: comment
    run: wiki comments create ${id} --body "note ${RUN}"
    save:
      comment: id
  - id: reply
    run: wiki comments create ${id} --body "reply ${RUN}" --parent-id ${comment}
    expect:
      "to_string(parent_id) == '${comment}'": true
    save:
      reply: id
  # thread-list rebuilds the thread (the comment, then its replies) from the page's comments.
  - id: thread-list
    run: wiki comments thread-list ${id} ${comment}
    expect:
      "length(@)": 2
      "[0].content": note ${RUN}
      "[1].content": reply ${RUN}
  # The server's own thread endpoint answers an empty list for every thread (checked live
  # 2026-10-02, see the SDK docstring); a list is all this step holds it to.
  - id: thread-get
    run: wiki comments thread-get ${id} ${comment}
    expect:
      "type(@)": array
  - id: reply-delete
    run: wiki comments delete ${id} ${reply}
    expect:
      comments_count: 1
  - id: comment-delete
    run: wiki comments delete ${id} ${comment}
    expect:
      comments_count: 0
  # Access goes to someone else only: Wiki refuses to grant a page to its own owner.
  - id: grant
    needs: [GRANTEE]
    run: wiki access create ${id} --role reader --user-uid ${GRANTEE} --inheritance not_inherited
    save:
      access: id
  - id: grant-more
    needs: [GRANTEE]
    run: wiki access update ${id} ${access} --role editor --inheritance inherited --prevent-selflock
  - id: grant-revoke
    needs: [GRANTEE]
    run: wiki access delete ${id} ${access} --prevent-selflock
  - id: grant-again
    needs: [GRANTEE]
    run: wiki access create ${id} --role reader --user-uid ${GRANTEE} --inheritance not_inherited
  - id: grants-clear
    needs: [GRANTEE]
    run: wiki access clear ${id} --prevent-selflock
  - id: clone
    run: wiki pages clone ${id} --target ${RUN}/clone --title "${RUN} clone"
  - id: move
    run: wiki pages move ${RUN}/clone ${RUN}/moved
  # The same two without --wait: each prints the id of its operation, and the status reads
  # come after other commands so that the operations have finished.
  - id: clone-async
    run: wiki pages clone ${id} --target ${RUN}/clone-async --title "${RUN} clone async" --no-wait
    expect:
      operation.type: clone
    save:
      clone_op: operation.id
  - id: move-async
    run: wiki pages move ${RUN}/moved ${RUN}/moved-async --no-wait
    expect:
      operation.type: move
    save:
      move_op: operation.id
  - id: clone-status
    run: wiki operations clone-get ${clone_op}
    expect:
      status: success
      "result.page.slug": ${RUN}/clone-async
  - id: move-status
    run: wiki operations move-get ${move_op}
    expect:
      status: success
      result.page_count: 1
  - id: grid-clone-status
    run: wiki operations clone-inline-grid-get ${grid_clone_op}
    expect:
      status: success
      "result.grid_id != null": true
  # Only now: the clone above was still reading this grid while it ran.
  - id: grid-delete
    run: wiki grids delete ${grid}
  - id: tree
    run: wiki pages descendants-list ${RUN} --include-self --all
    expect:
      "length(@)": 5
      "contains([].slug, '${RUN}/moved-async')": true
      "contains([].slug, '${RUN}/clone-async')": true
      "contains([].slug, '${RUN}/copy-async')": true
  - id: delete
    run: wiki pages delete ${id} --recursive
    disarms: [create]
