name: api-drift

# Weekly: fetch what Yandex publishes (the Wiki and Forms OpenAPI documents, Tracker's API
# reference) and compare it with scripts/api_snapshot/. It also regenerates the DataLens
# models from the specification DataLens publishes and reports a difference. While they differ, one issue labelled
# `api-drift` stays open with the changes. It never pushes, so it cannot trigger a release.
# Not a required check.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-drift
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The mcp extra: the contract cases the script replays import the MCP hint sets.
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      # A failed fetch fails the run; an empty report means Yandex changed nothing.
      - name: Compare the live API with the snapshot
        run: |
          uv run python scripts/api_drift.py --live > "$RUNNER_TEMP/changes.md"
          cat "$RUNNER_TEMP/changes.md" >> "$GITHUB_STEP_SUMMARY"
      # The models of DataLens are generated from its specification, which is not committed:
      # this is the one place they are compared with it. A run that cannot regenerate them
      # still reports the rest: the failure is written into the issue and ends the job last.
      - name: Compare the DataLens models with the published specification
        run: |
          : > "$RUNNER_TEMP/models.md"
          status=0
          uv run python scripts/gen_datalens_models.py --check --live > "$RUNNER_TEMP/models.txt" || status=$?
          if [ -s "$RUNNER_TEMP/models.txt" ]; then
            {
              echo "### DataLens models"
              echo
              echo "The generated models no longer match the specification DataLens publishes."
              echo "\`uv run scripts/gen_datalens_models.py\` regenerates them:"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/models.txt"
            } > "$RUNNER_TEMP/models.md"
          elif [ "$status" -ne 0 ]; then
            {
              echo "### DataLens models"
              echo
              echo "The models could not be regenerated from the published specification"
              echo "(exit code $status): see the log of the run."
            } > "$RUNNER_TEMP/models.md"
            touch "$RUNNER_TEMP/models.failed"
          fi
          cat "$RUNNER_TEMP/models.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create api-drift --color D93F0B --force \
            --description "Yandex changed an API that ycli wraps"
          number="$(gh issue list --label api-drift --state open --json number --jq '.[0].number // empty')"
          if [ -s "$RUNNER_TEMP/changes.md" ] || [ -s "$RUNNER_TEMP/models.md" ]; then
            {
              echo "What Yandex publishes no longer matches what ycli holds."
              if [ -s "$RUNNER_TEMP/changes.md" ]; then
                echo
                echo "### \`scripts/api_snapshot/\`"
                echo
                cat "$RUNNER_TEMP/changes.md"
                echo
                echo "To accept the change: \`uv run python scripts/api_drift.py --refresh\`, then"
                echo "\`uv run python scripts/gen_coverage.py --write\`. \`uv run pytest tests/tooling/test_api_drift.py\`"
                echo "fails on a new operation until ycli wraps it or lists it in \`NOT_WRAPPED\`."
              fi
              if [ -s "$RUNNER_TEMP/models.md" ]; then
                echo
                cat "$RUNNER_TEMP/models.md"
              fi
              echo
              echo "Found by [this run]($RUN_URL); this issue is rewritten by every later run."
            } > "$RUNNER_TEMP/body.md"
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue create --title "Yandex changed a published API" --label api-drift \
                --body-file "$RUNNER_TEMP/body.md"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The published API matches the snapshot again ($RUN_URL)."
          fi
      - name: Fail when the DataLens models could not be regenerated
        if: always()
        run: test ! -e "$RUNNER_TEMP/models.failed"
