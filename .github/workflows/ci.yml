name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # --all-extras pulls in the optional 'mcp' extra (fastmcp) so the
        # 100%-coverage suite, which exercises the MCP modules, can import it.
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest
