name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo and runs tests.
permissions:
  contents: read

# Supersede in-flight runs for the same ref — the latest commit is all that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --all-extras pulls in the optional 'mcp' extra (fastmcp) so the
        # 100%-coverage suite, which exercises the MCP modules, can import it.
        run: uv sync --locked --all-extras --dev
      # Lint/format/imports/types are Python-version-independent — run them once (on 3.12)
      # instead of in every matrix leg. pytest stays in every leg (the only version-sensitive
      # step). The required check `test (3.12)` still carries the lint gate.
      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .
      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .
      - name: Check architecture boundaries
        if: matrix.python-version == '3.12'
        run: uv run lint-imports
      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run ty check
      - name: Run tests
        run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
