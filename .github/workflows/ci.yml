name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo and runs tests.
permissions:
  contents: read

# Supersede in-flight runs for the same ref — the latest commit is all that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Window: the `requires-python` floor up to the latest stable CPython. On each October
        # release add the new version here; the `tests` job below keeps the required check stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --all-extras pulls in the optional 'mcp' extra (fastmcp) so the
        # 100%-coverage suite, which exercises the MCP modules, can import it.
        run: uv sync --locked --all-extras --dev
      # Lint/format/imports/types are Python-version-independent — run them once (on 3.12)
      # instead of in every matrix leg. pytest stays in every leg (the only version-sensitive
      # step). The required check `test (3.12)` still carries the lint gate.
      - name: Format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .
      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .
      - name: Check architecture boundaries
        if: matrix.python-version == '3.12'
        run: uv run lint-imports
      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run ty check
      - name: Run tests
        run: uv run pytest

  # One stable name for the ruleset to require, so moving the version window never needs a
  # ruleset edit. `if: always()` is needed: a skipped or failed matrix would otherwise skip this job.
  tests:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  package:
    uses: ./.github/workflows/package.yml

  rulesync:
    runs-on: ubuntu-latest
    env:
      RULESYNC_VERSION: 24.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Not `generate --check`: it flags the gitignored per-machine MCP files, so diff tracked files.
      - name: Regenerate agent config
        run: npx --yes "rulesync@${RULESYNC_VERSION}" generate
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated agent config is stale. Run 'rulesync generate' and commit the result."
            exit 1
          fi

  skills:
    runs-on: ubuntu-latest
    env:
      SKILLS_REF_VERSION: 0.1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # .rulesync/skills/ holds rulesync sources (own `targets:` key), not Agent Skills spec files.
      - name: Validate skill frontmatter
        run: |
          status=0
          for skill in plugins/*/skills/*/ .agents/skills/*/ .claude/skills/*/ .opencode/skills/*/; do
            uvx --from "skills-ref==${SKILLS_REF_VERSION}" agentskills validate "$skill" || status=1
          done
          exit "$status"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
