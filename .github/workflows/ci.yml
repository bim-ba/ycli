name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo and runs tests.
permissions:
  contents: read

# Supersede in-flight runs for the same ref — the latest commit is all that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --all-extras pulls in the optional 'mcp' extra (fastmcp) so the
        # 100%-coverage suite, which exercises the MCP modules, can import it.
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest
