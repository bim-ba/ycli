name: demo

# Verify-only: re-render docs/assets/demo.gif from docs/demo/demo.tape and FAIL if the
# committed asset is stale. The committed GIF is the source of truth — a contributor
# regenerates it locally (`vhs docs/demo/demo.tape`) and commits it; this check proves
# it's current. It never pushes, so — unlike the old auto-commit design — it cannot fail
# against branch protection on `main`, cannot run on release tags (fixing the every-release
# failure), and cannot poison a PR's required-check gate with a bot commit.

on:
  pull_request:
    paths:
      - 'docs/demo/**'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'docs/demo/**'
      - '.github/workflows/demo.yml'

permissions:
  contents: read

# One render per ref is enough; a newer push supersedes an in-flight one.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The tape's shim runs the REAL `ycli --help`, so the project must be installed.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --dev --extra mcp  # mcp extra: the tape's `mcp methods` step

      # Install VHS + ttyd ourselves (ffmpeg is preinstalled on ubuntu-latest).
      # The charmbracelet/vhs-action bundles flaky font/ffmpeg downloaders that
      # break on the runner, so we set the toolchain up directly instead.
      #
      # Both tools are version-pinned (no mutable `latest`) and ttyd is checksum-
      # verified, so the verify-only GIF diff is byte-deterministic across runs.
      # Bump TTYD_VERSION / TTYD_SHA256 (from that release's SHA256SUMS) and
      # VHS_VERSION together when upgrading.
      - name: Cache VHS binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: vhs-${{ runner.os }}-v0.11.0
      - name: Install VHS toolchain
        env:
          TTYD_VERSION: "1.7.7"
          TTYD_SHA256: "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55"
          VHS_VERSION: "v0.11.0"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL -o /tmp/ttyd.x86_64 \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /tmp/ttyd.x86_64" | sha256sum -c -
          sudo install -m 0755 /tmp/ttyd.x86_64 /usr/local/bin/ttyd
          gobin="$(go env GOPATH)/bin"
          if [ ! -x "${gobin}/vhs" ]; then
            go install "github.com/charmbracelet/vhs@${VHS_VERSION}"
          fi
          echo "${gobin}" >> "$GITHUB_PATH"

      - name: Render demo GIF
        run: vhs docs/demo/demo.tape

      - name: Verify the committed GIF is current
        run: |
          if ! git diff --quiet -- docs/assets/demo.gif; then
            git diff --stat -- docs/assets/demo.gif
            echo '::error::docs/assets/demo.gif is stale — run `vhs docs/demo/demo.tape` and commit the result.'
            exit 1
          fi
          echo 'docs/assets/demo.gif is up to date.'
