name: demo

# Regenerate docs/assets/demo.gif from docs/demo/demo.tape whenever the demo
# source changes, and commit the result back — so the README demo is always a
# real, current recording (never a hand-edited asset).

on:
  push:
    paths:
      - 'docs/demo/**'
      - '.github/workflows/demo.yml'

permissions:
  contents: write

# One render at a time — two quick docs pushes would otherwise race to commit the GIF.
concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      # The tape's shim runs the REAL `ycli --help`, so the project must be installed.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --dev

      # Install VHS + ttyd ourselves (ffmpeg is preinstalled on ubuntu-latest).
      # The charmbracelet/vhs-action bundles flaky font/ffmpeg downloaders that
      # break on the runner, so we set the toolchain up directly instead.
      - name: Install VHS toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Render demo GIF
        run: vhs docs/demo/demo.tape

      - name: Commit regenerated GIF
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          # [skip ci]: the GIF-only commit shouldn't spin up CI or the release workflow.
          commit_message: "docs: regenerate demo GIF [skip ci]"
          file_pattern: docs/assets/demo.gif
          commit_user_name: vhs-action 📼
          commit_user_email: actions@github.com
          commit_author: vhs-action 📼 <actions@github.com>
