name: demo

# Report-only: re-render docs/assets/demo.gif from docs/demo/demo.tape and REPORT drift
# (never fail) — a fresh render is uploaded as an artifact. Rendering still catches a
# broken tape, but a byte-diff is a notice, not a failure: VHS/ttyd renders aren't
# reliably byte-identical, so the committed GIF stays the source of truth and a
# contributor regenerates it locally (`vhs docs/demo/demo.tape`) + commits when the tape
# changes meaningfully. It never pushes, so — unlike the old auto-commit design — it cannot
# fail against branch protection on `main`, cannot run on release tags, and cannot poison a
# PR's required-check gate.

on:
  pull_request:
    paths:
      - 'docs/demo/**'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'docs/demo/**'
      - '.github/workflows/demo.yml'

permissions:
  contents: read

# One render per ref is enough; a newer push supersedes an in-flight one.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vhs:
    runs-on: ubuntu-latest
    # Single source of truth for the pinned toolchain: the cache key and the installer both
    # read these, so a version bump can't desync them. Bump VHS_VERSION, TTYD_VERSION, and
    # TTYD_SHA256 (from that release's SHA256SUMS) together when upgrading.
    env:
      TTYD_VERSION: "1.7.7"
      TTYD_SHA256: "8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55"
      VHS_VERSION: "v0.11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tape's shim runs the REAL `ycli --help`, so the project must be installed.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --locked --dev --extra mcp  # mcp extra: the tape's `mcp methods` step

      # Install VHS + ttyd ourselves (ffmpeg is preinstalled on ubuntu-latest).
      # The charmbracelet/vhs-action bundles flaky font/ffmpeg downloaders that
      # break on the runner, so we set the toolchain up directly instead.
      #
      # Both tools are version-pinned (no mutable `latest`) and ttyd is checksum-
      # verified for a reproducible render (the drift report is informational). Versions
      # live in the job-level `env:` above so the cache key and installer never desync.
      - name: Cache VHS binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: vhs-${{ runner.os }}-${{ env.VHS_VERSION }}
      - name: Install VHS toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL -o /tmp/ttyd.x86_64 \
            "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64"
          echo "${TTYD_SHA256}  /tmp/ttyd.x86_64" | sha256sum -c -
          sudo install -m 0755 /tmp/ttyd.x86_64 /usr/local/bin/ttyd
          gobin="$(go env GOPATH)/bin"
          if [ ! -x "${gobin}/vhs" ]; then
            go install "github.com/charmbracelet/vhs@${VHS_VERSION}"
          fi
          echo "${gobin}" >> "$GITHUB_PATH"

      - name: Render demo GIF
        run: vhs docs/demo/demo.tape

      - name: Report demo GIF drift (non-failing)
        run: |
          if ! git diff --quiet -- docs/assets/demo.gif; then
            git diff --stat -- docs/assets/demo.gif
            echo '::notice::demo.gif differs from a fresh render. VHS/ttyd output is not reliably byte-identical, so this is informational — the fresh render is uploaded as an artifact; regenerate + commit only if the tape changed meaningfully.'
          else
            echo 'demo.gif matches a fresh render.'
          fi
      - name: Upload fresh render
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif-fresh
          path: docs/assets/demo.gif
          if-no-files-found: error
