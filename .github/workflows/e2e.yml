name: e2e

# Live scenarios (e2e/) against the Yandex 360 test organization. Not a required check.
# Logs are public: the runner prints step ids, expectations and short scrubbed excerpts only.
on:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      select:
        description: "pytest -k expression (empty: every scenario)"
        required: false
        default: ""
      surface:
        description: "who carries out the writes (binary: the installed command, no comparison)"
        type: choice
        options: [binary, mcp, sdk]
        default: binary

permissions:
  contents: read

# One shared organization: runs queue behind each other and are never cancelled midway,
# so no run's cleanup is cut off.
concurrency:
  group: yandex-e2e
  cancel-in-progress: false

jobs:
  # Once per run, before any scenario: the token is checked and what earlier runs left behind
  # is removed. The scenario jobs run side by side, and three janitors at once would race for
  # the same leftovers.
  prepare:
    # Pull requests from forks get no secrets, so they skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: yandex-e2e
    env:
      YCLI_E2E_QUEUE: ${{ vars.YCLI_E2E_QUEUE || 'YCLIPAGE' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      # The token is not refreshed in CI; when this fails, reissue it and update the secret.
      - name: Preflight (credentials valid)
        env:
          YANDEX_ID_OAUTH_TOKEN: ${{ secrets.YANDEX_ID_OAUTH_TOKEN }}
          YANDEX_ID_ORGANIZATION_ID: ${{ secrets.YANDEX_ID_ORGANIZATION_ID }}
        run: |
          status=0
          uv run ycli -o json auth status > "$RUNNER_TEMP/auth.json" || status=$?
          jq -c '[.services[] | {service, valid}]' "$RUNNER_TEMP/auth.json"
          exit "$status"
      - name: Janitor (leftovers of earlier runs)
        env:
          YANDEX_ID_OAUTH_TOKEN: ${{ secrets.YANDEX_ID_OAUTH_TOKEN }}
          YANDEX_ID_ORGANIZATION_ID: ${{ secrets.YANDEX_ID_ORGANIZATION_ID }}
        run: uv run python -m e2e.janitor --older-than 6h --max 200

  live:
    needs: prepare
    # A pull request runs the smoke subset in one job. A nightly or a manual run is one job per
    # service: no scenario reaches into another service, so they run side by side, and within
    # a service the scenarios still run one after another.
    strategy:
      fail-fast: false
      matrix:
        # DataLens is not here: CI has no token it takes. The service account has no DataLens
        # seat, and a person's token is not kept in the secrets. Its scenarios run by hand.
        service: ${{ fromJSON(github.event_name == 'pull_request' && '["all"]' || '["tracker", "wiki", "forms"]') }}
    name: live (${{ matrix.service }})
    runs-on: ubuntu-latest
    # Tracker on three surfaces, with the pause below, ran 15 minutes (measured).
    timeout-minutes: 30
    environment: yandex-e2e
    env:
      YCLI_E2E: "1"
      YCLI_E2E_QUEUE: ${{ vars.YCLI_E2E_QUEUE || 'YCLIPAGE' }}
      # Whom the access steps grant a page, a form and a project to; unset, they are skipped.
      YCLI_E2E_GRANTEE: ${{ vars.YCLI_E2E_GRANTEE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The `mcp` extra on purpose not on a pull request: the smoke subset drives the installed
      # command as a user without the extra has it.
      - name: Install dependencies
        run: uv sync --locked --dev ${{ github.event_name != 'pull_request' && '--extra mcp' || '' }}
      - name: Scenarios
        env:
          YANDEX_ID_OAUTH_TOKEN: ${{ secrets.YANDEX_ID_OAUTH_TOKEN }}
          YANDEX_ID_ORGANIZATION_ID: ${{ secrets.YANDEX_ID_ORGANIZATION_ID }}
          # Pull requests run the smoke subset; nightly and manual runs run everything.
          MARKERS: ${{ github.event_name == 'pull_request' && 'live and smoke' || 'live' }}
          SELECT: ${{ inputs.select }}
          SERVICE: ${{ matrix.service }}
          YCLI_E2E_RUNS_FILE: ${{ runner.temp }}/e2e-runs
          EVENT: ${{ github.event_name }}
          SURFACE: ${{ inputs.surface }}
        run: |
          service=()
          if [ "$SERVICE" != all ]; then service=(--service "$SERVICE"); fi
          # A nightly run takes its turn of three by the day of the year: the installed command
          # as it is, then every write through MCP, then through the SDK. On the two last the
          # reads are compared on three surfaces (e2e/README.md, "Three surfaces"). The load on
          # the organization stays one write per step.
          surface="${SURFACE:-binary}"
          if [ "$EVENT" = schedule ]; then
            turns=(binary mcp sdk)
            surface="${turns[$((10#$(date -u +%j) % 3))]}"
          fi
          surfaces=()
          if [ "$surface" != binary ]; then
            # The pause: commands of one process follow each other faster than Tracker settles
            # after a write; with one second a sprint's change of state was refused (measured).
            surfaces=(--surfaces report --writes-through "$surface" --record-pause 2.5)
          fi
          echo "writes through: $surface"
          uv run pytest e2e --no-cov -n 0 -p no:cacheprovider -m "$MARKERS" "${service[@]}" "${surfaces[@]}" ${SELECT:+-k "$SELECT"}
      # Only what this job named: each job has its own list of runs, so the janitors of the
      # three jobs never reach for the same object, nor for a developer's.
      - name: Janitor (leftovers of this run)
        if: always()
        env:
          YANDEX_ID_OAUTH_TOKEN: ${{ secrets.YANDEX_ID_OAUTH_TOKEN }}
          YANDEX_ID_ORGANIZATION_ID: ${{ secrets.YANDEX_ID_ORGANIZATION_ID }}
        run: uv run python -m e2e.janitor --older-than 0s --max 200 --runs-file "$RUNNER_TEMP/e2e-runs"
