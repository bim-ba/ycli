name: release

# Automated releases (python-semantic-release) + PyPI publishing via trusted
# publishing (OIDC). On push to main, the smoke job (package.yml) first builds and
# smoke-tests the dist, so a broken package is never tagged; then PSR computes the
# next version from Conventional Commits, stamps pyproject + the plugin manifest +
# CHANGELOG, tags `vX.Y.Z`, and creates
# a GitHub Release; the publish job then builds that tag and uploads to PyPI —
# all in one run. PyPI upload needs no token (OIDC); the git push uses a
# short-lived GitHub App installation token (no long-lived PAT) so PSR can write
# the release commit + tag to main past the branch-protection ruleset. The
# manual workflow_dispatch path stays for ad-hoc publishing to TestPyPI/PyPI.
# After PyPI, four more jobs ship the same release: the documentation site (`docs`), the GHCR
# image (`docker`), the MCP Registry entry (`registry`, needs the image) and the Claude Desktop
# bundle attached to the GitHub Release (`mcpb`). They run only for an automated release, never for a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      index:
        description: "Index to publish to (manual runs only)"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'push'
    uses: ./.github/workflows/package.yml

  release:
    needs: [smoke]
    # Automated versioning only on push to main; manual dispatch skips straight to publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    permissions:
      contents: write   # PSR pushes the release commit + tag and creates the GitHub Release
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
      version: ${{ steps.psr.outputs.version }}
    steps:
      # Mint a short-lived GitHub App installation token so PSR can push the
      # release commit + tag to main past branch protection. The default
      # GITHUB_TOKEN provably cannot bypass a ruleset (it is not a valid bypass
      # actor); the App is added to the ruleset's bypass list as an Integration.
      # The token is scoped to this repo and auto-revoked when the job ends.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # PSR needs full history to evaluate commits
          token: ${{ steps.app-token.outputs.token }}   # push as the App, not the default token
      - name: Pin to the triggering commit
        run: git reset --hard ${{ github.sha }}
      - name: Semantic version release
        id: psr
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      # PSR bumps pyproject's version but never touches uv.lock, so the very next
      # push to main reds the required `uv sync --locked` check until a human ships
      # a manual `build:` re-lock. Do it here, in the same run, as the same App that
      # just pushed the release commit (its token is already checked out as the push
      # remote and is the sole branch-protection bypass actor). The resulting `build:`
      # commit lands PSR as a no-op on its next run — no version bump, no recursion.
      - name: Install uv (for the post-release re-lock)
        if: steps.psr.outputs.released == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Re-lock and commit uv.lock
        if: steps.psr.outputs.released == 'true'
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current for ${{ steps.psr.outputs.version }} — nothing to re-lock."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: re-lock uv.lock for ${{ steps.psr.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

  publish:
    needs: [release]
    # Auto: only when PSR cut a release. Manual: always, to the chosen index.
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release.outputs.released == 'true')
      )
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.index) || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl smoke_test.py
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz smoke_test.py

      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.index }}" = "testpypi" ]; then
            uv publish --index testpypi
          else
            uv publish
          fi

      # Non-fatal: a Context7 outage must not fail a release that is already on PyPI.
      - name: Refresh Context7 docs
        if: github.event_name == 'push'
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if ! curl --silent --show-error --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d "{\"libraryName\": \"/${GITHUB_REPOSITORY}\"}"; then
            echo "::warning::Context7 refresh failed; trigger it from the Context7 dashboard."
          fi

  docs:
    needs: [release, publish]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      deploy: true
      ref: ${{ needs.release.outputs.tag }}

  docker:
    needs: [release, publish]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/bim-ba/ycli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bim-ba/ycli
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The registry checks the PyPI package (README ownership marker) and the OCI image (public, with
  # the `io.modelcontextprotocol.server.name` label), so it runs after both are live.
  registry:
    needs: [release, publish, docker]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # `mcp-publisher login github-oidc` grants io.github.bim-ba/*
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      # sha256 of mcp-publisher_linux_amd64.tar.gz, also listed in registry_1.8.1_checksums.txt of that release
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --location --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish

  mcpb:
    needs: [release, publish]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the bundle to the GitHub Release PSR created
    env:
      MCPB_VERSION: 2.1.2
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Pack the bundle
        run: npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" pack mcpb "yandex-360-${RELEASE_VERSION}.mcpb"
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "yandex-360-${RELEASE_VERSION}.mcpb" --clobber
