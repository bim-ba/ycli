name: release

# Automated releases (python-semantic-release) + PyPI publishing via trusted
# publishing (OIDC). On push to main, PSR computes the next version from
# Conventional Commits, stamps pyproject + CHANGELOG, tags `vX.Y.Z`, and creates
# a GitHub Release; the publish job then builds that tag and uploads to PyPI —
# all in one run. PyPI upload needs no token (OIDC); the git push uses a
# short-lived GitHub App installation token (no long-lived PAT) so PSR can write
# the release commit + tag to main past the branch-protection ruleset. The
# manual workflow_dispatch path stays for ad-hoc publishing to TestPyPI/PyPI.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      index:
        description: "Index to publish to (manual runs only)"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  release:
    # Automated versioning only on push to main; manual dispatch skips straight to publish.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    permissions:
      contents: write   # PSR pushes the release commit + tag and creates the GitHub Release
    outputs:
      released: ${{ steps.psr.outputs.released }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      # Mint a short-lived GitHub App installation token so PSR can push the
      # release commit + tag to main past branch protection. The default
      # GITHUB_TOKEN provably cannot bypass a ruleset (it is not a valid bypass
      # actor); the App is added to the ruleset's bypass list as an Integration.
      # The token is scoped to this repo and auto-revoked when the job ends.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # PSR needs full history to evaluate commits
          token: ${{ steps.app-token.outputs.token }}   # push as the App, not the default token
      - name: Pin to the triggering commit
        run: git reset --hard ${{ github.sha }}
      - name: Semantic version release
        id: psr
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      # PSR bumps pyproject's version but never touches uv.lock, so the very next
      # push to main reds the required `uv sync --locked` check until a human ships
      # a manual `build:` re-lock. Do it here, in the same run, as the same App that
      # just pushed the release commit (its token is already checked out as the push
      # remote and is the sole branch-protection bypass actor). The resulting `build:`
      # commit lands PSR as a no-op on its next run — no version bump, no recursion.
      - name: Install uv (for the post-release re-lock)
        if: steps.psr.outputs.released == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Re-lock and commit uv.lock
        if: steps.psr.outputs.released == 'true'
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current for ${{ steps.psr.outputs.version }} — nothing to re-lock."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: re-lock uv.lock for ${{ steps.psr.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

  publish:
    needs: [release]
    # Auto: only when PSR cut a release. Manual: always, to the chosen index.
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.release.outputs.released == 'true')
      )
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.index) || 'pypi' }}
    permissions:
      id-token: write   # trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl smoke_test.py
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz smoke_test.py

      - name: Publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.index }}" = "testpypi" ]; then
            uv publish --index testpypi
          else
            uv publish
          fi
