name: docs

# Built on every pull request; published only by a release (release.yml, which grants the Pages
# permissions) or by hand, so the site describes the version on PyPI.

on:
  pull_request:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # --frozen, not --locked, in every step: a release tag carries the new version before uv.lock is re-locked.
      - name: Check the overridden theme partial against its original
        run: uv run --frozen --isolated --only-group docs scripts/check_theme_override.py
      - name: Check the Compose example
        env:
          MCP_DOMAIN: mcp.example.com
          YANDEX_ID_ORGANIZATION_ID: "1"
          YANDEX_OAUTH_CLIENT_ID: client-id
          YANDEX_OAUTH_CLIENT_SECRET: placeholder
        run: docker compose --file docs/examples/compose.yaml config --quiet
      - name: Read the Zensical version
        id: zensical
        run: echo "version=$(uv run --frozen --isolated --only-group docs zensical --version)" >> "$GITHUB_OUTPUT"
      # The social cards need Roboto, fetched from Google Fonts unless it is already here.
      - name: Restore the social card fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/plugin/social/fonts
          key: social-fonts-zensical-${{ steps.zensical.outputs.version }}
      # No --clean: the checkout is fresh, and --clean would delete the restored fonts. Only the fonts are cached, never Zensical's page cache, which it advises against keeping in CI.
      - name: Build
        run: |
          uv run --frozen --isolated --only-group docs zensical build
          uv run --frozen --isolated --only-group docs zensical build --config-file zensical.ru.toml
      # About a megabyte and rewritten by every model change, so generated here, not committed.
      - name: Generate the OpenAPI documents
        run: uv run --frozen --all-extras scripts/gen_openapi.py site/openapi
      - name: Upload the site
        if: inputs.deploy || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: [site]
    if: inputs.deploy || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
